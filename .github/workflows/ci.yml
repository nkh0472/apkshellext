name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-build:
    name: dotnet SDK build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The committed global.json targets developer machines, where Visual Studio 18
      # resolves SDK 11. CI's Visual Studio 2022 carries MSBuild 17.14, which cannot
      # load SDK 11 (it wants MSBuild >= 18.7) and fails restore, so both CI jobs pin
      # the SDK setup-dotnet installed instead of weakening the file for everyone.
      - name: Pin the .NET SDK for CI
        shell: pwsh
        run: |
          '{ "sdk": { "version": "10.0.404", "rollForward": "latestPatch" } }' |
            Set-Content -Path global.json -Encoding utf8NoBOM
          $version = dotnet --version
          Get-Content global.json
          "resolved SDK: $version"
          if ($version -notlike '10.0.*') { throw "expected SDK 10.0.x, got $version" }

      # The snk is gitignored, so CI signs only when the base64 key is configured.
      # A missing secret must never fail the build: the local-debug fallback is an
      # unsigned Release (the publish route signs later, T-G3).
      - name: Restore strong-name key (optional secret)
        shell: pwsh
        env:
          SNK_B64: ${{ secrets.APKSHELLEXT2_SNK_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SNK_B64)) {
            "SIGNING=off" | Out-File -FilePath $env:GITHUB_ENV -Append
            "signing skipped: no secret" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host 'signing skipped: no secret'
          } else {
            $keyPath = Join-Path $env:GITHUB_WORKSPACE 'ApkShellext2\apkshellext2_hy.snk'
            [System.IO.File]::WriteAllBytes($keyPath, [System.Convert]::FromBase64String($env:SNK_B64))
            "SIGNING=on" | Out-File -FilePath $env:GITHUB_ENV -Append
            "signing enabled from secrets.APKSHELLEXT2_SNK_B64" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host 'signing enabled: snk restored from secrets.APKSHELLEXT2_SNK_B64'
          }

      - name: Build Release (warnings as errors)
        shell: pwsh
        run: |
          $signAssembly = if ($env:SIGNING -eq 'on') { 'true' } else { 'false' }
          dotnet build ApkShellext2\ApkShellext2.csproj -c Release --nologo -warnaserror "-p:SignAssembly=$signAssembly"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check publish layout
        shell: pwsh
        run: |
          & .\eng\check-layout.ps1 -Route dotnet

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: apkshellext2-dotnet
          path: ApkShellext2\bin\Release
          if-no-files-found: error

  vs-build:
    name: Visual Studio MSBuild build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The two routes deliberately use different SDKs. The dotnet job can use the
      # pinned 10.0.404 because the dotnet CLI carries its own MSBuild; the VS job
      # drives the runner's Visual Studio 2022 MSBuild 17.14, and an SDK newer than
      # 9.x (10.0.404 needs MSBuild >= 18.0.0) cannot be loaded by it. The VS route
      # exists for the FullFramework resource pipeline, not for the compiler
      # version, so it stays on the newest SDK that 17.14 can load.
      - name: Set up .NET SDK 9 (MSBuild 17.14 compatible)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # 9.0.100 + latestFeature resolves to whichever 9.0.x setup-dotnet installed
      # (the runner may get a newer feature band), and the assertion fails the job
      # if the SDK ever falls outside 9.0.x - e.g. when global.json drifts back to
      # the developer-machine file with its latestMajor roll forward.
      - name: Pin the .NET SDK for CI
        shell: pwsh
        run: |
          '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' |
            Set-Content -Path global.json -Encoding utf8NoBOM
          $version = dotnet --version
          Get-Content global.json
          "resolved SDK: $version"
          if ($version -notlike '9.0.*') { throw "expected SDK 9.0.x, got $version" }

      - name: Restore strong-name key (optional secret)
        shell: pwsh
        env:
          SNK_B64: ${{ secrets.APKSHELLEXT2_SNK_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SNK_B64)) {
            "SIGNING=off" | Out-File -FilePath $env:GITHUB_ENV -Append
            "signing skipped: no secret" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host 'signing skipped: no secret'
          } else {
            $keyPath = Join-Path $env:GITHUB_WORKSPACE 'ApkShellext2\apkshellext2_hy.snk'
            [System.IO.File]::WriteAllBytes($keyPath, [System.Convert]::FromBase64String($env:SNK_B64))
            "SIGNING=on" | Out-File -FilePath $env:GITHUB_ENV -Append
            "signing enabled from secrets.APKSHELLEXT2_SNK_B64" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host 'signing enabled: snk restored from secrets.APKSHELLEXT2_SNK_B64'
          }

      - name: Restore
        shell: pwsh
        run: |
          $signAssembly = if ($env:SIGNING -eq 'on') { 'true' } else { 'false' }
          msbuild ApkShellext2\ApkShellext2.csproj -t:restore -p:Configuration=Release -nologo -v:m "-p:SignAssembly=$signAssembly"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release (warnings as errors)
        shell: pwsh
        run: |
          $signAssembly = if ($env:SIGNING -eq 'on') { 'true' } else { 'false' }
          msbuild ApkShellext2\ApkShellext2.csproj -p:Configuration=Release -nologo -v:m -warnaserror "-p:SignAssembly=$signAssembly"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check publish layout
        shell: pwsh
        run: |
          & .\eng\check-layout.ps1 -Route vs

      # Only the VS route is gated: that tree is what gets packaged and shipped, and
      # the dotnet route additionally carries System.Resources.Extensions.dll, which
      # would make the same byte limits meaningless.
      - name: Check package size
        shell: pwsh
        run: |
          & .\eng\check-size.ps1

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: apkshellext2-vs
          path: ApkShellext2\bin\Release
          if-no-files-found: error

      - name: Upload 7z package
        uses: actions/upload-artifact@v4
        with:
          name: apkshellext2-vs-7z
          path: ApkShellext2\bin\Release\ApkShellext2-*.7z
          if-no-files-found: error
