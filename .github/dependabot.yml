# Dependency updates. Every generated PR runs the full CI workflow - both
# toolchains with warnings as errors, the layout gate and the test suite - so an
# update that breaks the net48 build or drops the satellite resources cannot
# merge unnoticed. Package size is reported, not gated.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(nuget)
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    # ApkShellext2\SVG\Generators is vendored upstream code (vvvv/SVG) that runs
    # as an analyzer of the main build. It implements the non-incremental
    # ISourceGenerator API, so Microsoft.CodeAnalysis 4.14+ makes RS1035 an
    # error (warnings are errors) unless the generator is rewritten as
    # IIncrementalGenerator. Keep the pair pinned to the versions the vendored
    # source compiles against; adopting newer Roslyn is a deliberate port with
    # the 87-sample icon baseline, not a dependency refresh.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"

  # Action major bumps (v4 -> v5) change runner requirements, so they come
  # individually; minor/patch movers of the existing pins are grouped.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(actions)
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # PNGDecrush is our fork pinned at a revision the icon pipeline was verified
  # against, so an automatic bump is exactly the change we do not want: adopting
  # a new upstream commit is a deliberate port with a 87-sample pixel baseline,
  # not a dependency refresh. Review upstream manually instead. The block stays
  # for any future submodule (SharpZipLib, SVG and WebP-wrapper were absorbed
  # into the repository in phase 2).
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(submodule)
    ignore:
      - dependency-name: "ApkShellext2/PNGDecrush"
